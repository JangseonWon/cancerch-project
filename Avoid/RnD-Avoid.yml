spring:
  application:
    name: Avoid-service
  main:
    web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: gemini:2181,pisces:2181,aries:2181,taurus:2181
      discovery:
        root: /RnD
    stream:
      function:
        definition: publish-model;broadcast-model;publish-sample;broadcast-sample;
      bindings:
        publish-model-out-0.destination: referral-classifier-models
        broadcast-model-in-0.destination: referral-classifier-models
        publish-sample-out-0.destination: referral-classifier-document-samples
        broadcast-sample-in-0.destination: referral-classifier-document-samples

      kafka:
        binder:
          brokers: gemini, pisces, aries, taurus, libra
          auto-add-partitions: true
  r2dbc:
    url: r2dbc:postgresql://gemini:5432/lims
    username: referral_classifier
    password: rc1004!@
    pool:
      initial-size: 100
      max-size: 500
      max-idle-time: 30m
      validation-query: SELECT 1
server:
  port: 0
  temp-directory: /data/lims/tmp/RnD/avoid