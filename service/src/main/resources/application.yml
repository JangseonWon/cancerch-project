spring:
  application:
    name: avoid-service
  main:
    web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: test:12181
      discovery:
        root: /services
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders:
              - AUTHORIZATION
              - X-USER-ID
              - Content-Type
            exposedHeaders:
              - X-Total-Count
              - X-Total-Page
              - X-Current-Page
            allowedMethods:
              - OPTIONS
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
      routes:
        - id: avoid-project-gateway
          uri: http://localhost:26040/
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Expose-Headers Vary
          predicates:
            - Path=/**
server:
  port: 26041