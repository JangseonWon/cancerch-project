spring:
  application:
    name: worklist-service
  main:
    web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: test:12181
      discovery:
        root: /RnD
    stream:
      function:
        definition: publish-worklist;broadcast-worklist;
      bindings:
        publish-worklist-out-0.destination: rnd-worklist
        broadcast-worklist-in-0.destination: rnd-worklist
      kafka:
        binder:
          brokers: localhost:9092
          auto-add-partitions: true
  r2dbc:
    url: r2dbc:postgresql://gemini:5432/lims
    username: rnd
    password: rnd1004!@
    pool:
      initial-size: 100
      max-size: 500
      max-idle-time: 30m
      validation-query: SELECT 1
server:
  port: 0
  temp-directory: D:\data\rnd\worklist