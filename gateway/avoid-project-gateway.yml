spring:
  application:
    name: avoid-gateway-service
  main:
    web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: gemini:2181,pisces:2181,aries:2181,taurus:2181
      discovery:
        root: /avoid-project
        register: false
    gateway:
      routes:
        - id: worklist-api
          uri: lb://worklist-api
          predicates:
            - Path=/worklist/**, /worklist.html, /worklist/*.js, /css/worklist.css
        - id: analysis-api
          uri: lb://analysis-api
          predicates:
            - Path=/analysis/**, /analysis.html, /analysis/*.js, /css/analysis.css
server:
  compression:
    enabled: true
    mime-types: text/javascript,application/javascript
    min-response-size: 2048
  port: 26040