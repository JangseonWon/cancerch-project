spring:
  application:
    name: avoid-gateway-service
  main:
    web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: gemini:2181,pisces:2181,aries:2181,taurus:2181
      discovery:
        root: /RnD
        register: false
    gateway:
      routes:
        - id: worklist-service
          uri: lb://worklist-service
          predicates:
            - Path=/worklist/**, /worklist.html, /worklist/*.js, /css/worklist.css
        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/analysis/**, /analysis.html, /analysis/*.js, /css/analysis.css
server:
  port: 26040