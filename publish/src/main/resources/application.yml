      username: cassandra
      password: snubi1004
      port: 9042
      keyspace-name: lims
      schema-action: NONE
      connect-timeout-millis: 10000s
      read-timeout-millis: 10000s
      connect-timeout: 10000s
      read-timeout: 10000s
