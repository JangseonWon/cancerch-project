spring:
  application:
    name: publish-api
  main:
    web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: localhost:12181
      discovery:
        root: /avoid-service
    stream:
      default:
        max.message.bytes: 67109632
      function:
        definition: publishRms;broadcast-publishing
      bindings:
        publish-rms-out-o:
          destination: report
          group: report
        broadcast-publishing-in-0:
          destination: alis-pdf-publisher-response
