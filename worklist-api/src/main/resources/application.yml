spring:
  application.name: worklist-api
  main.web-application-type: reactive
  cloud:
    zookeeper:
      connect-string: localhost:12181
      discovery.root: /avoid-service
    stream:
      bindings:
        broadcast-worklist-events-in-0:
          destination: avoid-worklist-events
          group: broadcast-worklist-events
        publish-worklist-events-out-0.destination: avoid-worklist-events
      kafka:
        binder:
          brokers: localhost
          auto-add-partitions: true
  r2dbc:
    url: r2dbc:postgresql://172.19.216.212:5432/lims
    compatibility-mode : true
    username: avoid
    password: avoid1004

logging:
  level:
    io.r2dbc.postgresql.QUERY: TRACE
    io.r2dbc.postgresql.PARAM: TRACE


server:
  resources : file:/data/lims/static/avoid-service/
  port: 54004
