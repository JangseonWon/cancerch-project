spring:
  application:
    name: base-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/ailis
    username: ailis
    password: ailis1234
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.idrsys.ailis: DEBUG
    org.springframework.r2dbc: DEBUG
